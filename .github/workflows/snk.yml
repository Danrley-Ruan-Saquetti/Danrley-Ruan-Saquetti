name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/snk.yml]

# Only one run at a time; a newer run waits instead of racing the force push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  OUTPUT_DIR: dist
  OUTPUT_FILE_LIGHT: github-contribution-grid-snake.svg
  OUTPUT_FILE_DARK: github-contribution-grid-snake-dark.svg
  OUTPUT_BRANCH: output

jobs:
  snake:
    name: Generate and publish snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_FILE_LIGHT }}?palette=github-light
            ${{ env.OUTPUT_DIR }}/${{ env.OUTPUT_FILE_DARK }}?palette=github-dark

      - name: Validate generated files
        run: |
          for file in "$OUTPUT_DIR/$OUTPUT_FILE_LIGHT" "$OUTPUT_DIR/$OUTPUT_FILE_DARK"; do
            cells=$(grep -o 'class="c[^"]*"' "$file" | wc -l)
            echo "$file: $cells grid cells"
            if [ "$cells" -lt 300 ]; then
              echo "::error file=$file::Expected a full contribution grid, found $cells cells"
              exit 1
            fi
          done

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: ${{ env.OUTPUT_BRANCH }}
          build_dir: ${{ env.OUTPUT_DIR }}
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
